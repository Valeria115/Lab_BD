services:
  db:
    image: postgres:16
    container_name: labs-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: db_labs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Lab1/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./Lab1/sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
